<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>Настройка интернета — RouterLab</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f7f9fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 18px 32px;display:grid;place-items:center}
main{max-width:410px;width:100%;text-align:center}.logo{font-size:16px;font-weight:700;color:#3159a7;margin-bottom:26px}
.mark{font-size:47px;background:#e4eefb;border-radius:22px;display:grid;place-items:center;width:86px;height:86px;margin:0 auto 23px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.7px;margin:0 0 14px}p{color:#59687d;font-size:16px;line-height:1.5;margin:0 0 27px}
a.action{display:block;border-radius:15px;padding:19px 16px;background:#2968d1;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
a.action.disabled{opacity:.5;pointer-events:none}.hint{font-size:13px;color:#58677f;line-height:1.5;margin-top:15px}
details{margin-top:48px;text-align:left;border-top:1px solid #d9e0ea;padding-top:17px;font-size:13px;color:#6c798c}
summary{cursor:pointer;font-weight:600}label{display:block;margin:12px 0 5px}input{width:100%;border:1px solid #afbed1;border-radius:9px;padding:12px;font-size:16px}
.subtle{display:block;margin-top:14px;color:#415e8b;text-decoration:underline}
</style>
</head>
<body>
<main>
 <div class="logo">RouterLab</div>
 <div class="mark" aria-hidden="true">⌁</div>
 <h1>Настроим ваш интернет</h1>
 <p>Подключитесь к Wi-Fi нового роутера и нажмите кнопку. Дальше приложение проверит устройство.</p>
 <a id="openApp" class="action" href="routerlab://open?host=192.168.0.1">Начать настройку</a>
 <div class="hint" id="status" aria-live="polite">Пока требуется установленное приложение RouterLab. Автонастройка доступна только для проверенных моделей.</div>
 <details id="technical">
  <summary>Для специалиста</summary>
  <label for="host">Адрес роутера</label>
  <input id="host" type="text" value="192.168.0.1" spellcheck="false" autocomplete="off" inputmode="decimal">
  <div class="hint" id="hostStatus"></div>
  <a id="openRouter" class="subtle" href="http://192.168.0.1">Открыть штатный интерфейс</a>
 </details>
</main>
<script>
'use strict';
const hostInput=document.getElementById('host');
const appLink=document.getElementById('openApp');
const routerLink=document.getElementById('openRouter');
const hostStatus=document.getElementById('hostStatus');
function isPrivateIPv4(s){
 const parts=s.split('.');
 if(parts.length!==4||!parts.every(v=>/^\d{1,3}$/.test(v)&&Number(v)<=255))return false;
 const [a,b]=parts.map(Number);
 return a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168);
}
function refresh(){
 const h=hostInput.value.trim(),ok=isPrivateIPv4(h);
 appLink.href=ok?'routerlab://open?host='+encodeURIComponent(h):'#';
 routerLink.href=ok?'http://'+h:'#';
 appLink.classList.toggle('disabled',!ok);
 appLink.setAttribute('aria-disabled',String(!ok));
 hostStatus.textContent=ok?'Локальный адрес подтверждён':'Введите локальный IPv4-адрес роутера';
}
const requested=new URLSearchParams(window.location.search).get('host');
if(requested&&isPrivateIPv4(requested))hostInput.value=requested;
hostInput.addEventListener('input',refresh);refresh();
</script>
</body>
</html>
