name: NetCheckWalkTest
options:
  bundleIdPrefix: dev.netcheck
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NetCheckWalkTest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NetCheckWalkTest.swift
      - path: WiFiSpectrumView.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NetCheck Explorer
        CFBundleShortVersionString: "0.3.5"
        CFBundleVersion: "8"
        NSLocationWhenInUseUsageDescription: "NetCheck использует компас для оценки направления телефона при ходьбе. GPS и координаты не собираются."
        NSLocalNetworkUsageDescription: "NetCheck может по вашему запросу прочитать текущие каналы на поддерживаемом домашнем роутере Netis N2. Настройки не изменяются."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMotionUsageDescription: "NetCheck Explorer использует шагомер для измерения пройденного расстояния во время обследования сети."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.netcheck.walktest
        PRODUCT_NAME: NetCheckWalkTest
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
