name: Cudy WR1200 pre-hardware acceptance

on:
  push:
    branches:
      - research/cudy-wr1200-hardware-matrix
    paths:
      - "devices/cudy/wr1200/**"
      - "tools/routerlab/web-demo/**"
      - "tools/routerlab/cudy-r26-compat/**"
      - ".github/workflows/cudy-wr1200-prehardware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cudy-wr1200-prehardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      ROOT: /home/runner/cudy-wr1200-prehardware

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip file squashfs-tools python3 qemu-user-static proot lua5.1

      - name: Syntax preflight
        run: |
          set -Eeuo pipefail
          bash -n tools/routerlab/cudy-r26-compat/prepare-firmware.sh
          bash -n tools/routerlab/web-demo/cudy-factory-runtime.sh
          bash -n tools/routerlab/web-demo/cudy-quick-setup.sh
          bash -n tools/routerlab/web-demo/cudy-resilient-setup.sh
          bash -n tools/routerlab/web-demo/cudy-fresh-auth.sh
          bash -n tools/routerlab/web-demo/cudy-verify-configured-state.sh
          bash -n tools/routerlab/web-demo/cudy-prehardware-acceptance.sh

      - name: Prepare exact firmware images
        run: |
          set -Eeuo pipefail
          mkdir -p "$ROOT/images"

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'R7-1.13.9' \
            'https://www.cudy.com/cdn/shop/files/WR1200-R7-1.13.9-20220407-145654-flash.zip?v=2563825277745206136' \
            'WR1200-R7-1.13.9-20220407-145654-flash.zip' \
            "$ROOT/images/r7" \
            'b45d2749cbe91d6accbed45382b09912c46a8ed1cdb48c2ee8833f3692919065' \
            'a430c48776f5d52a66284c22ad57cbf2a18f3d24f2f638f4876a484728d939e0'

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'R26-2.4.23' \
            'https://www.cudy.com/cdn/shop/files/WR1200V2-R26-2.4.23-20251224-145945-flash.zip?v=10287497656812635253' \
            'WR1200V2-R26-2.4.23-20251224-145945-flash.zip' \
            "$ROOT/images/r26" \
            'def1d4b8472b5fef4d0f13d337d6c2f11127d14ef6bd7100780dbac0115aa35c' \
            'b9842ca6d6b54d4d2b8bb4d13457ee674ba2d13540443af1cf1ce82708ea02cd'

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'R149-2.5.24' \
            'https://www.cudy.com/cdn/shop/files/WR1200V3-R149-2.5.24-20260727-130115-flash.zip?v=13150855755067218599' \
            'WR1200V3-R149-2.5.24-20260727-130115-flash.zip' \
            "$ROOT/images/r149" \
            'db728d8aace55cd94e14dd132316e1473b1aefe0ee830046ec9a6e4d40b818c1' \
            '358781987487e8d48d2ad8e8a660410b634bbb6b90f82af2f2786d9b31cad45c'

      - name: Run R26 reference pre-hardware gate
        run: |
          set -Eeuo pipefail
          ROUTERLAB_CUDY_ROOTFS="$ROOT/images/r26/rootfs" \
          ROUTERLAB_CUDY_WEB_WORK="$ROOT/labs/r26" \
          ROUTERLAB_CUDY_RUNTIME="$ROOT/labs/r26/runtime" \
          ROUTERLAB_CUDY_REPORT="$ROOT/reports/r26" \
          ROUTERLAB_CUDY_PORT=18226 \
          ROUTERLAB_CUDY_BOARD_NAME=R26 \
          ROUTERLAB_CUDY_MODEL_NAME='Cudy WR1200 2.x R26' \
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
            bash tools/routerlab/web-demo/cudy-prehardware-acceptance.sh

      - name: Run R149 pre-hardware gate
        run: |
          set -Eeuo pipefail
          ROUTERLAB_CUDY_ROOTFS="$ROOT/images/r149/rootfs" \
          ROUTERLAB_CUDY_WEB_WORK="$ROOT/labs/r149" \
          ROUTERLAB_CUDY_RUNTIME="$ROOT/labs/r149/runtime" \
          ROUTERLAB_CUDY_REPORT="$ROOT/reports/r149" \
          ROUTERLAB_CUDY_PORT=18249 \
          ROUTERLAB_CUDY_BOARD_NAME=R149 \
          ROUTERLAB_CUDY_MODEL_NAME='Cudy WR1200 3.0 R149' \
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
            bash tools/routerlab/web-demo/cudy-prehardware-acceptance.sh

      - name: Run R7 legacy pre-hardware gate
        run: |
          set -Eeuo pipefail
          ROUTERLAB_CUDY_ROOTFS="$ROOT/images/r7/rootfs" \
          ROUTERLAB_CUDY_WEB_WORK="$ROOT/labs/r7" \
          ROUTERLAB_CUDY_RUNTIME="$ROOT/labs/r7/runtime" \
          ROUTERLAB_CUDY_REPORT="$ROOT/reports/r7" \
          ROUTERLAB_CUDY_PORT=18207 \
          ROUTERLAB_CUDY_BOARD_NAME=R7 \
          ROUTERLAB_CUDY_MODEL_NAME='Cudy WR1200 1.0 R7' \
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
            bash tools/routerlab/web-demo/cudy-prehardware-acceptance.sh

      - name: Build acceptance summary
        if: always()
        run: |
          set -u
          {
            echo '# WR1200 pre-hardware acceptance'
            echo
            echo '| Board | Result |'
            echo '|---|---|'
            for key in r26 r149 r7; do
              if grep -q "PREHARDWARE=PASS" "$ROOT/reports/$key/"*.log "$ROOT/reports/$key/"*.txt 2>/dev/null; then result=PASS; else result=CHECK; fi
              echo "| $key | $result |"
            done
          } > "$ROOT/PREHARDWARE.md"
          cat "$ROOT/PREHARDWARE.md"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-wr1200-prehardware
          path: |
            /home/runner/cudy-wr1200-prehardware/PREHARDWARE.md
            /home/runner/cudy-wr1200-prehardware/reports/
          retention-days: 14
