name: RouterLab Archer C54 firmware vs C20
on:
  push:
    branches:
      - research/routerlab-c54-v1-port-from-c20
    paths:
      - tools/tplink-c54/**
      - .github/workflows/routerlab-archer-c54-firmware.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c54-static:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binwalk
      - name: Analyze C54 EU V1 and compare with C20
        run: |
          python3 -m py_compile tools/tplink-c54/inspect-stock.py
          python3 tools/tplink-c54/inspect-stock.py "$GITHUB_WORKSPACE/tmp-c54-report"
      - name: Show summary even on extraction failure
        if: always()
        run: |
          if [ -f "tmp-c54-report/REPORT.md" ]; then
            cat tmp-c54-report/REPORT.md
          fi
      - name: Upload reports, not vendor firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-c54-v1-c20-fingerprint
          path: |
            tmp-c54-report/REPORT.json
            tmp-c54-report/REPORT.md
          retention-days: 7
          if-no-files-found: warn
