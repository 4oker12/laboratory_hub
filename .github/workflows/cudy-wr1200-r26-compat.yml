name: Cudy WR1200 R26 firmware compatibility

on:
  push:
    branches:
      - research/cudy-wr1200-r26-compat-matrix
    paths:
      - "devices/cudy/wr1200/**"
      - "tools/routerlab/cudy-r26-compat/**"
      - "tools/routerlab/web-demo/**"
      - ".github/workflows/cudy-wr1200-r26-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cudy-wr1200-r26-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    env:
      MATRIX: /home/runner/cudy-r26-compat

    steps:
      - uses: actions/checkout@v4

      - name: Install RouterLab dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             curl unzip file squashfs-tools python3 qemu-user-static proot lua5.1

      - name: Syntax preflight
        run: |
          set -Eeuo pipefail
          bash -n tools/routerlab/cudy-r26-compat/prepare-firmware.sh
          bash -n tools/routerlab/cudy-r26-compat/run-matrix.sh
          bash -n tools/routerlab/web-demo/cudy-factory-runtime.sh
          bash -n tools/routerlab/web-demo/cudy-quick-setup.sh
          bash -n devices/cudy/wr1200/v2-r26-2.4.23/probe-factory-bootstrap.sh
          python3 -m py_compile             tools/routerlab/cudy-r26-compat/contract-snapshot.py             tools/routerlab/cudy-r26-compat/compare-contracts.py

      - name: Run complete R26 compatibility sweep
        run: |
          set -Eeuo pipefail
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static             bash tools/routerlab/cudy-r26-compat/run-matrix.sh "$MATRIX"

      - name: Show compatibility index
        if: always()
        run: |
          echo "===== MATRIX INDEX ====="
          cat "$MATRIX/reports/INDEX.md" 2>/dev/null || true
          echo
          echo "===== PAIR REPORT HEADERS ====="
          for f in "$MATRIX"/reports/2.4.23-vs-*.md; do
            [[ -f "$f" ]] || continue
            echo "--- $f ---"
            sed -n '1,90p' "$f"
          done

      - name: Upload complete compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-wr1200-r26-compatibility-sweep
          path: |
            /home/runner/cudy-r26-compat/reports/
            /home/runner/cudy-r26-compat/probe-rc/
            /home/runner/cudy-r26-compat/*/report/
            /home/runner/cudy-r26-compat/*/acceptance/
          retention-days: 14
