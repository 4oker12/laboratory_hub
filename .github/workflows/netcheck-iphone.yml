name: NetCheck Walk Test iPhone IPA
on:
  push:
    branches:
      - feat/netcheck-shortcuts-probe-v036
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  iphone-unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile for iPhone (device, not simulator)
        run: |
          xcodebuild -project NetCheckWalkTest.xcodeproj -scheme NetCheckWalkTest \
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
          -derivedDataPath "$RUNNER_TEMP/NetCheckOutput" \
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled motion privacy key
        run: |
          APP="$RUNNER_TEMP/NetCheckOutput/Build/Products/Release-iphoneos/NetCheckWalkTest.app"
          /usr/libexec/PlistBuddy -c "Print :NSMotionUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")" = "0.3.6"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/NetCheckOutput/Build/Products/Release-iphoneos/NetCheckWalkTest.app" Payload/
          zip -r -q NetCheckWalkTest-UNSIGNED.ipa Payload
      - name: Build NetCheck WiFi Probe (unsigned Shortcuts plist)
        run: |
          python3 scripts/netcheck/build_shortcut.py --output "$RUNNER_TEMP/NetCheck-WiFi-Probe-UNSIGNED.shortcut"
          plutil -lint "$RUNNER_TEMP/NetCheck-WiFi-Probe-UNSIGNED.shortcut"
      - name: Sign Shortcut for iOS import (Apple iCloud service)
        id: shortcut_sign
        continue-on-error: true
        run: |
          shortcuts sign --mode anyone --input "$RUNNER_TEMP/NetCheck-WiFi-Probe-UNSIGNED.shortcut" --output "$RUNNER_TEMP/NetCheck WiFi Probe.shortcut"
          test -s "$RUNNER_TEMP/NetCheck WiFi Probe.shortcut"
      - name: Upload signed Shortcut if available
        if: steps.shortcut_sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NetCheck-WiFi-Probe-SIGNED-Shortcut
          path: ${{ runner.temp }}/NetCheck WiFi Probe.shortcut
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: NetCheckWalkTest-UNSIGNED-iPhone
          path: NetCheckWalkTest-UNSIGNED.ipa
          retention-days: 7