name: WR3000 isolated stock Lua runtime probe
on:
  push:
    branches:
      - feat/cudy-wr3000-v1-ios-probe
    paths:
      - ".github/workflows/wr3000-qemu-runtime.yml"
      - "devices/cudy/wr3000/v1-r31-2.4.19/probe_runtime.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-stock:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-runtime]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install userspace emulation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools proot qemu-user-static
      - name: Verify stock Lua interpreter under QEMU and load qsetup without executing writes
        run: |
          python3 devices/cudy/wr3000/v1-r31-2.4.19/probe_runtime.py --out wr3000-runtime
      - name: Export sanitized runtime status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr3000-stock-qemu-runtime-status
          path: wr3000-runtime/runtime.json
          if-no-files-found: warn
          retention-days: 7
