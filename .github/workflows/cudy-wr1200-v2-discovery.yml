name: Cudy WR1200 V2 firmware discovery

on:
  push:
    branches:
      - research/cudy-wr1200
    paths:
      - "devices/cudy/wr1200/**"
      - ".github/workflows/cudy-wr1200-v2-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cudy-wr1200-v2-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install discovery tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip file squashfs-tools python3 qemu-user-static proot

      - name: Download and inspect exact official firmware
        run: |
          chmod +x devices/cudy/wr1200/v2-r26-2.4.23/discover-firmware.sh
          devices/cudy/wr1200/v2-r26-2.4.23/discover-firmware.sh "$HOME/cudy-wr1200-discovery"

      - name: Capture stock management-plane contract
        run: |
          chmod +x devices/cudy/wr1200/v2-r26-2.4.23/analyze-stock-contract.sh
          devices/cudy/wr1200/v2-r26-2.4.23/analyze-stock-contract.sh \
            "$HOME/cudy-wr1200-discovery/rootfs" \
            "$HOME/cudy-wr1200-discovery/report"

      - name: Probe stock MIPS userspace
        run: |
          chmod +x devices/cudy/wr1200/v2-r26-2.4.23/probe-stock-runtime.sh
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
            devices/cudy/wr1200/v2-r26-2.4.23/probe-stock-runtime.sh \
              "$HOME/cudy-wr1200-discovery/rootfs" \
              "$HOME/cudy-wr1200-discovery/report"

      - name: Probe stock LuCI management plane
        run: |
          chmod +x devices/cudy/wr1200/v2-r26-2.4.23/probe-management-plane.sh
          QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
            devices/cudy/wr1200/v2-r26-2.4.23/probe-management-plane.sh \
              "$HOME/cudy-wr1200-discovery/rootfs" \
              "$HOME/cudy-wr1200-management-plane" \
              "$HOME/cudy-wr1200-discovery/report"

      - name: Show concise discovery report
        if: always()
        run: |
          sed -n '1,240p' "$HOME/cudy-wr1200-discovery/report/DISCOVERY.md" 2>/dev/null || true
          echo
          echo "===== stock contract grep ====="
          sed -n '1,360p' "$HOME/cudy-wr1200-discovery/report/stock-contract-grep.txt" 2>/dev/null || true
          echo
          echo "===== bootstrap grep ====="
          sed -n '1,360p' "$HOME/cudy-wr1200-discovery/report/bootstrap-grep.txt" 2>/dev/null || true
          echo
          echo "===== runtime dependencies ====="
          sed -n '1,260p' "$HOME/cudy-wr1200-discovery/report/runtime-dependencies.txt" 2>/dev/null || true
          echo
          echo "===== Lua bytecode printable constants ====="
          sed -n '1,1200p' "$HOME/cudy-wr1200-discovery/report/lua-bytecode-strings.txt" 2>/dev/null || true
          echo
          echo "===== bootstrap files ====="
          sed -n '1,1200p' "$HOME/cudy-wr1200-discovery/report/bootstrap-files.txt" 2>/dev/null || true
          echo
          echo "===== stock runtime probe ====="
          sed -n '1,500p' "$HOME/cudy-wr1200-discovery/report/stock-runtime-probe.txt" 2>/dev/null || true
          echo
          echo "===== bdinfo probe ====="
          sed -n '1,500p' "$HOME/cudy-wr1200-discovery/report/bdinfo-probe.txt" 2>/dev/null || true
          echo
          echo "===== management-plane probe ====="
          sed -n '1,1200p' "$HOME/cudy-wr1200-discovery/report/management-plane-probe.txt" 2>/dev/null || true
          echo
          echo "===== R26 board/bootstrap authority ====="
          sed -n '1,2200p' "$HOME/cudy-wr1200-discovery/report/board-bootstrap-authority.txt" 2>/dev/null || true

      - name: Upload metadata reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-wr1200-v2-discovery-report
          path: ~/cudy-wr1200-discovery/report/
          retention-days: 14
