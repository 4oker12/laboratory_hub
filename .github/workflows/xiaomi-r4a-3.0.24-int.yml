          grep -q '"code":0' "$OUT/set-router-normal.json"
          grep -q '"inited":1' "$OUT/init-info-after-setup.json"
          grep -q '"routername":"RouterLabFirstRun"' "$OUT/init-info-after-setup.json"

          # The compatibility injection is factory-only. Once stock reports
          # inited=1, the same anonymous write must be rejected again.
          curl -sS --max-time 12             -H 'Host: router.miwifi.com'             -H 'Content-Type: application/x-www-form-urlencoded'             -o "$OUT/post-init-anon-set-location.json"             --data 'location=UA'             'http://127.0.0.1:18090/cgi-bin/luci/api/misystem/set_location'
          grep -q '"code":401' "$OUT/post-init-anon-set-location.json"

          bash "$VR" status --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory | tee "$OUT/status.txt"
          grep -q 'HTTP_FRONTDOOR=up' "$OUT/status.txt"
          grep -q 'STOCK_FCGI=up' "$OUT/status.txt"

          # Cold boot the same virtual router state after the stock wizard completed.
          bash "$VR" restart --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

          root_after_code="$(curl -sS --max-time 12 -H 'Host: router.miwifi.com' -o "$OUT/root-after.body" -D "$OUT/root-after.headers" -w '%{http_code}' 'http://127.0.0.1:18090/')"
          test "$root_after_code" = "200"

          login_after_code="$(curl -sS --max-time 15 -H 'Host: router.miwifi.com' -H 'Content-Type: application/x-www-form-urlencoded' -c "$OUT/after.cookies" -o "$OUT/login-after.json" -w '%{http_code}' --data-urlencode 'username=admin' --data-urlencode "password=$new_admin" --data-urlencode 'logtype=2' 'http://127.0.0.1:18090/cgi-bin/luci/api/xqsystem/login')"
          test "$login_after_code" = "200"
          grep -q '"code":0' "$OUT/login-after.json"
          token_after="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$OUT/login-after.json")"
          test "${#token_after}" = "32"

          curl -sS --max-time 15 -H 'Host: router.miwifi.com' -b "$OUT/after.cookies" -o "$OUT/wifi-after-factory-cold-boot.json" "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token_after/api/xqnetwork/wifi_detail_all"
          grep -q '"ssid":"RouterLabFirstRun"' "$OUT/wifi-after-factory-cold-boot.json"
          grep -q '"ssid":"RouterLabFirstRun_5G"' "$OUT/wifi-after-factory-cold-boot.json"
          grep -q '"password":"RouterLabWifi88"' "$OUT/wifi-after-factory-cold-boot.json"

          curl -sS --max-time 12 -H 'Host: router.miwifi.com' -o "$OUT/init-info-after-cold-boot.json" 'http://127.0.0.1:18090/cgi-bin/luci/api/xqsystem/init_info'
          grep -q '"inited":1' "$OUT/init-info-after-cold-boot.json"
          grep -q '"routername":"RouterLabFirstRun"' "$OUT/init-info-after-cold-boot.json"

          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

      - name: Factory first-run PPPoE compatibility probe
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$HOME/routerlab-xiaomi-r4a/audit/squashfs-root"
          BASE="$HOME/routerlab-xiaomi-r4a/factory-pppoe-ci"
          VR="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/virtual-router.sh"
          OUT="$HOME/routerlab-xiaomi-r4a/factory-pppoe-acceptance"
          mkdir -p "$OUT"

          bash "$VR" reset --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory
          bash "$VR" start --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

          # Stock first-run UI logs in with init=1 before entering /web/init/guide.
          account_hash="$(awk '/option .admin./ {gsub(/\047/,"",$3); print $3; exit}' "$BASE/runtime/rootfs/etc/config/account")"
          device='routerlab-pppoe'
          now="$(date +%s)"
          nonce="0_${device}_${now}_2001"
          oldpwd="$(python3 -c 'import hashlib,sys; print(hashlib.sha1((sys.argv[1]+sys.argv[2]).encode()).hexdigest())' "$nonce" "$account_hash")"

          # hello.htm uses $.getJSON(), so reproduce the stock GET login exactly.
          curl -sS --max-time 15 -G \
            -H 'Host: router.miwifi.com' \
            -c "$OUT/factory.cookies" \
            -o "$OUT/factory-login.json" \
            --data-urlencode 'username=admin' \
            --data-urlencode 'logtype=2' \
            --data-urlencode "password=$oldpwd" \
            --data-urlencode "nonce=$nonce" \
            --data-urlencode 'init=1' \
            'http://127.0.0.1:18090/cgi-bin/luci/api/xqsystem/login'
          grep -q '"code":0' "$OUT/factory-login.json"
          token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$OUT/factory-login.json")"
          guide_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$OUT/factory-login.json")"
          test "${#token}" = "32"

          # The real browser follows rsp.url into /web/init/guide before WAN setup.
          guide_code="$(curl -sS --max-time 20 \
            -H 'Host: router.miwifi.com' \
            -b "$OUT/factory.cookies" \
            -o "$OUT/guide.html" \
            -w '%{http_code}' \
            "http://127.0.0.1:18090$guide_url")"
          test "$guide_code" = "200"
          grep -q 'pppoeName' "$OUT/guide.html"

          curl -sS --max-time 20 \
            -H 'Host: router.miwifi.com' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -b "$OUT/factory.cookies" \
            -o "$OUT/set-wan-pppoe.json" \
            --data-urlencode 'wanType=pppoe' \
            --data-urlencode 'pppoeName=RouterLabPPPoEUser' \
            --data-urlencode 'pppoePwd=RouterLabPPPoEPass88' \
            "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token/api/xqnetwork/set_wan"

          grep -q '"code":0' "$OUT/set-wan-pppoe.json"
          grep -q "option proto 'pppoe'" "$BASE/runtime/rootfs/etc/config/network"
          grep -q "option username 'RouterLabPPPoEUser'" "$BASE/runtime/rootfs/etc/config/network"
          grep -q "option password 'RouterLabPPPoEPass88'" "$BASE/runtime/rootfs/etc/config/network"

          # Secondary compatibility probe only. SIMNET's primary subscriber path is DHCP.
          # No PPPoE peer/server exists in RouterLab, so session success is not part of core acceptance.
          echo 'PPPOE_SESSION=unknown_not_emulated' > "$OUT/session-state.txt"

          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

      - name: Persistent virtual router cold boot acceptance
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$HOME/routerlab-xiaomi-r4a/audit/squashfs-root"
          BASE="$HOME/routerlab-xiaomi-r4a/virtual-router-ci"
          VR="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/virtual-router.sh"
          OUT="$HOME/routerlab-xiaomi-r4a/virtual-router-acceptance"
          mkdir -p "$OUT"

          bash "$VR" reset --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured
          bash "$VR" start --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

          login() {
            local suffix="$1"
            curl -sS --max-time 12 \
              -H 'Host: router.miwifi.com' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -c "$OUT/cookies.$suffix.txt" \
              -o "$OUT/login.$suffix.json" \
              --data 'username=admin&password=admin&logtype=2' \
              'http://127.0.0.1:18090/cgi-bin/luci/api/xqsystem/login'
            python3 -c 'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text())["token"])' "$OUT/login.$suffix.json"
          }

          api_post() {
            local tag="$1" token="$2" data="$3" path="$4"
            curl -sS --max-time 15 \
              -H 'Host: router.miwifi.com' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -b "$OUT/cookies.before.txt" \
              -o "$OUT/$tag.json" \
              --data "$data" \
              "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token$path"
          }

          token="$(login before)"

          guard_code="$(curl -sS --max-time 8 -H 'Host: router.miwifi.com' -o "$OUT/ui-guard.js" -w '%{http_code}' 'http://127.0.0.1:18090/__routerlab/ui-guard.js')"
          test "$guard_code" = "200"
          grep -q 'routerlabDisabled' "$OUT/ui-guard.js"

          qos_code="$(curl -sS --max-time 8 -H 'Host: router.miwifi.com' -b "$OUT/cookies.before.txt" -o "$OUT/qos-disabled.html" -w '%{http_code}' "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token/web/setting/qos")"
          test "$qos_code" = "200"
          grep -q 'Недоступно в RouterLab' "$OUT/qos-disabled.html"
          ! grep -q 'qos_info' "$OUT/qos-disabled.html"

          api_post set-wan "$token" 'wanType=dhcp&client=web' '/api/xqnetwork/set_wan'
          api_post set-wifi24 "$token" 'wifiIndex=1&on=1&ssid=ColdBoot24&pwd=ColdBootPass24&encryption=psk2&channel=0&bandwidth=0&hidden=0&txpwr=max' '/api/xqnetwork/set_wifi'
          api_post set-wifi5 "$token" 'wifiIndex=2&on=1&ssid=ColdBoot5G&pwd=ColdBootPass5G&encryption=psk2&channel=0&bandwidth=0&hidden=0&txpwr=max' '/api/xqnetwork/set_wifi'

          grep -q '"code":0' "$OUT/set-wan.json"
          grep -q '"code":0' "$OUT/set-wifi24.json"
          grep -q '"code":0' "$OUT/set-wifi5.json"

          # This is the real emulator persistence boundary: save UCI state, destroy
          # runtime clone, recreate from immutable stock rootfs, restore state, start.
          bash "$VR" restart --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

          token2="$(login after)"
          curl -sS --max-time 15 \
            -H 'Host: router.miwifi.com' \
            -b "$OUT/cookies.after.txt" \
            -o "$OUT/wifi-after-cold-boot.json" \
            "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token2/api/xqnetwork/wifi_detail_all"

          grep -q '"ssid":"ColdBoot24"' "$OUT/wifi-after-cold-boot.json"
          grep -q '"password":"ColdBootPass24"' "$OUT/wifi-after-cold-boot.json"
          grep -q '"ssid":"ColdBoot5G"' "$OUT/wifi-after-cold-boot.json"
          grep -q '"password":"ColdBootPass5G"' "$OUT/wifi-after-cold-boot.json"
          grep -q "option proto 'dhcp'" "$BASE/runtime/rootfs/etc/config/network"

          bash "$VR" status --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured | tee "$OUT/status.txt"
          grep -q 'HTTP_FRONTDOOR=up' "$OUT/status.txt"
          grep -q 'STOCK_FCGI=up' "$OUT/status.txt"
          grep -q 'STOCK_INIT_INFO_HTTP=200' "$OUT/status.txt"

          cp "$BASE/state-v1/etc-config/network" "$OUT/network.persisted"
          cp "$BASE/state-v1/etc-config/wireless" "$OUT/wireless.persisted"
          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

      - name: Router client first-run acceptance
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$HOME/routerlab-xiaomi-r4a/audit/squashfs-root"
          BASE="$HOME/routerlab-xiaomi-r4a/router-client-first-run-ci"
          VR="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/virtual-router.sh"
          CLIENT="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/router-client.py"
          OUT="$HOME/routerlab-xiaomi-r4a/router-client-first-run-acceptance"
          mkdir -p "$OUT"

          bash "$VR" reset --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory
          bash "$VR" start --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

          set +x
          python3 "$CLIENT" --base-url http://127.0.0.1:18090 first-run             --router-name RouterAgentFactory             --ssid RouterAgentFactory             --wifi-password RouterAgentFactoryWifi88             --admin-password RouterAgentFactoryAdmin88             > "$OUT/first-run.json"
          set -x

          grep -q '"operation": "first-run"' "$OUT/first-run.json"
          grep -q '"inited": 0' "$OUT/first-run.json"
          grep -q '"inited": 1' "$OUT/first-run.json"
          grep -q '"routername": "RouterAgentFactory"' "$OUT/first-run.json"
          grep -q '"admin_login": "confirmed"' "$OUT/first-run.json"
          grep -q '"wifi_readback": "confirmed"' "$OUT/first-run.json"
          grep -q '"ssid": "RouterAgentFactory"' "$OUT/first-run.json"
          grep -q '"ssid": "RouterAgentFactory_5G"' "$OUT/first-run.json"
          ! grep -q 'RouterAgentFactoryWifi88' "$OUT/first-run.json"
          ! grep -q 'RouterAgentFactoryAdmin88' "$OUT/first-run.json"

          # Re-run the same first-run command against the already initialized state.
          # This models recovery after a previous caller lost the set_router_normal
          # response even though stock firmware committed the requested state.
          set +x
          python3 "$CLIENT" --base-url http://127.0.0.1:18090 first-run             --router-name RouterAgentFactory             --ssid RouterAgentFactory             --wifi-password RouterAgentFactoryWifi88             --admin-password RouterAgentFactoryAdmin88             > "$OUT/first-run-rerun.json"
          set -x

          grep -q '"inited": 1' "$OUT/first-run-rerun.json"
          grep -q '"status": "not_attempted"' "$OUT/first-run-rerun.json"
          grep -q '"state_verification": "confirmed"' "$OUT/first-run-rerun.json"
          grep -q '"outcome": "already_completed_verified"' "$OUT/first-run-rerun.json"
          ! grep -q 'RouterAgentFactoryWifi88' "$OUT/first-run-rerun.json"
          ! grep -q 'RouterAgentFactoryAdmin88' "$OUT/first-run-rerun.json"

          bash "$VR" restart --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

          set +x
          python3 "$CLIENT" --base-url http://127.0.0.1:18090 inspect             --admin-password RouterAgentFactoryAdmin88             > "$OUT/after-cold-boot.json"
          set -x

          grep -q '"inited": 1' "$OUT/after-cold-boot.json"
          grep -q '"status": "confirmed"' "$OUT/after-cold-boot.json"
          grep -q '"ssid": "RouterAgentFactory"' "$OUT/after-cold-boot.json"
          grep -q '"ssid": "RouterAgentFactory_5G"' "$OUT/after-cold-boot.json"

          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile factory

      - name: Router client acceptance
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$HOME/routerlab-xiaomi-r4a/audit/squashfs-root"
          BASE="$HOME/routerlab-xiaomi-r4a/router-client-ci"
          VR="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/virtual-router.sh"
          CLIENT="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/router-client.py"
          OUT="$HOME/routerlab-xiaomi-r4a/router-client-acceptance"
          mkdir -p "$OUT"

          bash "$VR" reset --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured
          bash "$VR" start --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

          python3 "$CLIENT" --base-url http://127.0.0.1:18090 inspect             > "$OUT/inspect-before.json"
          grep -q '"hardware": "R4A"' "$OUT/inspect-before.json"
          grep -q '"romversion": "3.0.24"' "$OUT/inspect-before.json"
          grep -q '"inited": 1' "$OUT/inspect-before.json"

          python3 "$CLIENT" --base-url http://127.0.0.1:18090 service             --admin-password admin             --wan-type dhcp             --ssid-24 RouterAgent24             --ssid-5 RouterAgent5G             --wifi-password RouterAgentPass88             > "$OUT/configure-dhcp.json"

          grep -q '"wifi_readback": "confirmed"' "$OUT/configure-dhcp.json"
          grep -q '"ssid": "RouterAgent24"' "$OUT/configure-dhcp.json"
          grep -q '"ssid": "RouterAgent5G"' "$OUT/configure-dhcp.json"
          grep -q '"operation": "service"' "$OUT/configure-dhcp.json"
          grep -q '"configured_type": "dhcp"' "$OUT/configure-dhcp.json"
          grep -q '"wan_live_readback": "not_claimed"' "$OUT/configure-dhcp.json"
          ! grep -q 'RouterAgentPass88' "$OUT/configure-dhcp.json"

          bash "$VR" restart --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

          python3 "$CLIENT" --base-url http://127.0.0.1:18090 inspect             --admin-password admin             > "$OUT/inspect-after-cold-boot.json"
          grep -q '"status": "confirmed"' "$OUT/inspect-after-cold-boot.json"
          grep -q '"ssid": "RouterAgent24"' "$OUT/inspect-after-cold-boot.json"
          grep -q '"ssid": "RouterAgent5G"' "$OUT/inspect-after-cold-boot.json"
          ! grep -q 'RouterAgentPass88' "$OUT/inspect-after-cold-boot.json"

          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

      - name: Router client PPPoE compatibility probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$HOME/routerlab-xiaomi-r4a/audit/squashfs-root"
          BASE="$HOME/routerlab-xiaomi-r4a/router-client-pppoe-ci"
          VR="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/virtual-router.sh"
          CLIENT="devices/xiaomi/mi-router-4a-gigabit-r4a/3.0.24-int/router-client.py"
          OUT="$HOME/routerlab-xiaomi-r4a/router-client-pppoe-probe"
          mkdir -p "$OUT"

          bash "$VR" reset --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured
          bash "$VR" start --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured

          set +x
          python3 "$CLIENT" --base-url http://127.0.0.1:18090 configure             --admin-password admin             --wan-type pppoe             --pppoe-username RouterAgentPPPoEUser             --pppoe-password RouterAgentPPPoEPass88             --ssid-24 RouterAgent24             --ssid-5 RouterAgent5G             --wifi-password RouterAgentPass88             > "$OUT/configure-pppoe.json"
          rc=$?
          set -x

          echo "PPPOE_CLIENT_RC=$rc" > "$OUT/result.txt"
          if [ "$rc" -eq 0 ]; then
            grep -q '"configured_type": "pppoe"' "$OUT/configure-pppoe.json"
            ! grep -q 'RouterAgentPPPoEPass88' "$OUT/configure-pppoe.json"
          fi

          bash "$VR" stop --rootfs "$ROOTFS" --base "$BASE" --port 18090 --profile configured || true
          exit "$rc"

      - name: Collect concise runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          latest="$(find "$HOME/routerlab-xiaomi-r4a/rehost-work/runs" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1)"
          echo "LATEST=$latest"
          if [ -n "$latest" ]; then
            for f in REPORT.md startup-evidence.txt runtime-evidence.txt sysapi-config-test.log sysapihttpd.log fcgi.log probes.tsv; do
              echo
              echo "===== $f ====="
              sed -n '1,320p' "$latest/$f" 2>/dev/null || true
            done
          fi

      - name: Upload RouterLab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routerlab-r4a-rehost-evidence
          path: |
            ~/routerlab-xiaomi-r4a/rehost-ci-output.txt
            ~/routerlab-xiaomi-r4a/browser-wizard-contract.txt
            ~/routerlab-xiaomi-r4a/browser-wizard-backend-contract.txt
            ~/routerlab-xiaomi-r4a/browser-wizard-stock-evidence/
            ~/routerlab-xiaomi-r4a/language-causality/
            ~/routerlab-xiaomi-r4a/rehost-work/runs/
            ~/routerlab-xiaomi-r4a/compat-ci/
            ~/routerlab-xiaomi-r4a/config-acceptance/
            ~/routerlab-xiaomi-r4a/virtual-router-acceptance/
            ~/routerlab-xiaomi-r4a/browser-wizard-acceptance/
            ~/routerlab-xiaomi-r4a/factory-setup-acceptance/
            ~/routerlab-xiaomi-r4a/factory-pppoe-acceptance/
            ~/routerlab-xiaomi-r4a/router-client-first-run-acceptance/
            ~/routerlab-xiaomi-r4a/router-client-acceptance/
            ~/routerlab-xiaomi-r4a/router-client-pppoe-probe/
          if-no-files-found: warn
          retention-days: 7
