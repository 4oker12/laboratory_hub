          legacy_code="$(curl -sS --max-time 12             -H 'Host: router.miwifi.com'             -o "$OUT/legacy-hello.html"             -w '%{http_code}'             'http://127.0.0.1:18090/cgi-bin/luci/web/init/hello')"
          test "$legacy_code" = "200"

          # Follow the exact stock first-run credential protocol from web/init/guide.htm.
          account_hash="$(awk '/option .admin./ {gsub(/\047/,"",$3); print $3; exit}' "$BASE/runtime/rootfs/etc/config/account")"
          test -n "$account_hash"
          pwdkey='a2ffa5c9be07488bbb04a3a47d3c5f6a'
          iv='64175472480004614961023454661220'
          device='routerlab'
          t1="$(date +%s)"
          nonce1="0_${device}_${t1}_1001"
          oldpwd1="$(python3 -c 'import hashlib,sys; print(hashlib.sha1((sys.argv[1]+sys.argv[2]).encode()).hexdigest())' "$nonce1" "$account_hash")"
          init_login_code="$(curl -sS --max-time 15 -H 'Host: router.miwifi.com' -H 'Content-Type: application/x-www-form-urlencoded' -c "$OUT/factory.cookies" -o "$OUT/factory-login.json" -w '%{http_code}' --data-urlencode 'username=admin' --data-urlencode 'logtype=2' --data-urlencode "password=$oldpwd1" --data-urlencode "nonce=$nonce1" --data-urlencode 'init=1' 'http://127.0.0.1:18090/cgi-bin/luci/api/xqsystem/login')"
          test "$init_login_code" = "200"
          grep -q '"code":0' "$OUT/factory-login.json"
          token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$OUT/factory-login.json")"
          test "${#token}" = "32"

          # Prove that the real stock WAN settings template renders in factory mode.
          # It requires two hardware facts absent under qemu-user: the browser client's
          # LAN ARP MAC and the router's Factory-MTD default WAN MAC.
          wan_page_code="$(curl -sS --max-time 15 \
            -H 'Host: router.miwifi.com' \
            -b "$OUT/factory.cookies" \
            -o "$OUT/factory-wan.html" \
            -w '%{http_code}' \
            "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token/web/setting/wan")"
          test "$wan_page_code" = "200"
          grep -q 'name="pppoeName"' "$OUT/factory-wan.html"
          grep -q 'name="wantypeselect"' "$OUT/factory-wan.html"
          grep -q '02:11:22:33:44:64' "$OUT/factory-wan.html"
          grep -q '02:11:22:33:44:51' "$OUT/factory-wan.html"

          new_admin='RouterLabAdmin88'
          new_wifi='RouterLabFirstRun'
          new_wifi_pwd='RouterLabWifi88'
          new_hash="$(python3 -c 'import hashlib,sys; print(hashlib.sha1((sys.argv[1]+sys.argv[2]).encode()).hexdigest())' "$new_admin" "$pwdkey")"
          newpwd="$(printf '%s' "$new_hash" | openssl enc -aes-128-cbc -K "${account_hash:0:32}" -iv "$iv" -base64 -A)"
          t2="$((t1 + 1))"
          nonce2="0_${device}_${t2}_1002"
          oldpwd2="$(python3 -c 'import hashlib,sys; print(hashlib.sha1((sys.argv[1]+sys.argv[2]).encode()).hexdigest())' "$nonce2" "$account_hash")"

          set_normal_code="$(curl -sS --max-time 20 -H 'Host: router.miwifi.com' -H 'User-Agent: Mozilla/5.0 RouterLab' -H 'Content-Type: application/x-www-form-urlencoded' -b "$OUT/factory.cookies" -o "$OUT/set-router-normal.json" -w '%{http_code}' --data-urlencode 'name=RouterLabFirstRun' --data-urlencode 'locale=Home' --data-urlencode "ssid=$new_wifi" --data-urlencode "password=$new_wifi_pwd" --data-urlencode 'encryption=mixed-psk' --data-urlencode "nonce=$nonce2" --data-urlencode "newPwd=$newpwd" --data-urlencode "oldPwd=$oldpwd2" --data-urlencode 'txpwr=0' "http://127.0.0.1:18090/cgi-bin/luci/;stok=$token/api/misystem/set_router_normal" || true)"
          echo "set_router_normal_http=$set_normal_code" | tee "$OUT/setup-result.txt"
