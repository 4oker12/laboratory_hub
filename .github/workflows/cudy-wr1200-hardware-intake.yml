name: Cudy WR1200 hardware revision intake

on:
  push:
    branches:
      - research/cudy-wr1200-hardware-matrix
    paths:
      - "tools/routerlab/cudy-hardware-compat/**"
      - "tools/routerlab/cudy-r26-compat/**"
      - "tools/routerlab/web-demo/**"
      - ".github/workflows/cudy-wr1200-hardware-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      WORK: /home/runner/cudy-wr1200-hardware-intake

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip file squashfs-tools python3 binutils qemu-user-static proot lua5.1

      - name: Syntax preflight
        run: |
          set -Eeuo pipefail
          bash -n tools/routerlab/cudy-r26-compat/prepare-firmware.sh
          python3 -m py_compile tools/routerlab/cudy-hardware-compat/hardware-intake.py

      - name: Prepare WR1200 R7, R26, R149
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'WR1200-1.0-R7-1.13.9' \
            'https://www.cudy.com/cdn/shop/files/WR1200-R7-1.13.9-20220407-145654-flash.zip?v=2563825277745206136' \
            'WR1200-R7-1.13.9-20220407-145654-flash.zip' \
            "$WORK/r7"

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'WR1200-2.x-R26-2.4.23' \
            'https://www.cudy.com/cdn/shop/files/WR1200V2-R26-2.4.23-20251224-145945-flash.zip?v=10287497656812635253' \
            'WR1200V2-R26-2.4.23-20251224-145945-flash.zip' \
            "$WORK/r26" \
            'def1d4b8472b5fef4d0f13d337d6c2f11127d14ef6bd7100780dbac0115aa35c' \
            'b9842ca6d6b54d4d2b8bb4d13457ee674ba2d13540443af1cf1ce82708ea02cd'

          bash tools/routerlab/cudy-r26-compat/prepare-firmware.sh \
            'WR1200-3.0-R149-2.5.24' \
            'https://www.cudy.com/cdn/shop/files/WR1200V3-R149-2.5.24-20260727-130115-flash.zip?v=13150855755067218599' \
            'WR1200V3-R149-2.5.24-20260727-130115-flash.zip' \
            "$WORK/r149"

      - name: Build hardware intake reports
        run: |
          set -Eeuo pipefail
          python3 tools/routerlab/cudy-hardware-compat/hardware-intake.py "$WORK/r7/rootfs" "$WORK/r7/report/hardware-intake.json" --label "WR1200 1.0" --hardware R7 --firmware 1.13.9
          python3 tools/routerlab/cudy-hardware-compat/hardware-intake.py "$WORK/r26/rootfs" "$WORK/r26/report/hardware-intake.json" --label "WR1200 2.0/2.1" --hardware R26 --firmware 2.4.23
          python3 tools/routerlab/cudy-hardware-compat/hardware-intake.py "$WORK/r149/rootfs" "$WORK/r149/report/hardware-intake.json" --label "WR1200 3.0" --hardware R149 --firmware 2.5.24

      - name: Summarize first divergence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('/home/runner/cudy-wr1200-hardware-intake')
          rows=[]
          for key in ('r7','r26','r149'):
              d=json.loads((base/key/'report/hardware-intake.json').read_text())
              h=d['compatibility_hints']; m=d['markers']
              rows.append([
                  d['label'], d['hardware'], d['firmware'], d['arch_family'],
                  'yes' if h['has_luci_cgi'] else 'no',
                  'yes' if h['has_summary_cbi'] else 'no',
                  'yes' if h['has_qsetup'] else 'no',
                  'yes' if m['wizard'] else 'no',
                  'yes' if m['defpasswd'] else 'no',
                  len(d['wireless_summary']),
              ])
          out=base/'HARDWARE-INTAKE.md'
          lines=[
              '# Cudy WR1200 hardware revision intake','',
              '| Model | Board | Firmware | Arch | LuCI CGI | summary CBI | qsetup | wizard marker | defpasswd | Wi-Fi sections |',
              '|---|---|---|---|---|---|---|---|---|---:|',
          ]
          for r in rows:
              lines.append('| '+' | '.join(map(str,r))+' |')
          lines += ['', '## Details', '']
          for key in ('r7','r26','r149'):
              d=json.loads((base/key/'report/hardware-intake.json').read_text())
              lines += [
                  f"### {d['label']} / {d['hardware']} / {d['firmware']}", '',
                  f"- busybox: `{d['busybox_file']}`",
                  f"- compatibility hints: `{json.dumps(d['compatibility_hints'], sort_keys=True)}`",
                  f"- markers: `{json.dumps(d['markers'], sort_keys=True)}`",
                  f"- wireless: `{json.dumps(d['wireless_summary'], sort_keys=True)}`", '',
              ]
          out.write_text('\n'.join(lines)+'\n')
          print(out.read_text())
          PY

      - name: Capture auth and factory scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in r7 r149; do
            report="$WORK/$key/report"
            root="$WORK/$key/rootfs"
            {
              echo "===== /etc/uci-defaults/10_user ====="
              sed -n '1,260p' "$root/etc/uci-defaults/10_user" 2>/dev/null || true
              echo
              echo "===== sysauth template ====="
              sed -n '1,320p' "$root/usr/lib/lua/luci/view/themes/bootstrap/sysauth.htm" 2>/dev/null || true
              echo
              echo "===== sysauth javascript ====="
              sed -n '1,320p' "$root/www/luci-static/bootstrap/js/sysauth.js" 2>/dev/null || true
              echo
              echo "===== luci factory config ====="
              sed -n '1,220p' "$root/etc/config/luci" 2>/dev/null || true
              echo
              echo "===== user_add implementation ====="
              grep -RIna -m 20 'user_add()' "$root/lib" "$root/usr" 2>/dev/null || true
              grep -RIna -m 40 'passwd.*admin\|user_add admin' "$root/etc" "$root/lib" 2>/dev/null || true
              echo
              echo "===== factory passwd users ====="
              cut -d: -f1,3,4,6,7 "$root/etc/passwd" 2>/dev/null || true
              echo
              echo "===== factory shadow scheme only ====="
              awk -F: '{h=$2; if (h=="") s="empty"; else if (h=="!") s="locked"; else if (h=="*") s="star"; else if (h ~ /^\$/) {split(h,a,"$"); s="$" a[2] "$"} else s="other"; print $1 ":" s}' "$root/etc/shadow" 2>/dev/null || true
            } > "$report/auth-factory-contract.txt"
          done

      - name: Probe cross-hardware stock contracts
        shell: bash
        run: |
          set -u
          DEVICE=devices/cudy/wr1200/v2-r26-2.4.23
          for key in r149 r7; do
            mkdir -p "$WORK/$key/report"
            set +e
            bash "$DEVICE/analyze-stock-contract.sh" "$WORK/$key/rootfs" "$WORK/$key/report" \
              >"$WORK/$key/report/runner-stock-contract.log" 2>&1
            echo "$?" >"$WORK/$key/report/runner-stock-contract.rc"
            bash "$DEVICE/disassemble-stock-lua.sh" "$WORK/$key/rootfs" "$WORK/$key/report" \
              >"$WORK/$key/report/runner-disassembly.log" 2>&1
            echo "$?" >"$WORK/$key/report/runner-disassembly.rc"
            QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
              bash "$DEVICE/probe-auth-crypto.sh" "$WORK/$key/rootfs" "$WORK/$key/report" \
              >"$WORK/$key/report/runner-auth-crypto.log" 2>&1
            echo "$?" >"$WORK/$key/report/runner-auth-crypto.rc"
            set -e
            echo "===== $key stock probe ====="
            tail -n 120 "$WORK/$key/report/runner-stock-contract.log" || true
            echo "===== $key disassembly tail ====="
            tail -n 220 "$WORK/$key/report/runner-disassembly.log" || true
          done

      - name: Dynamic management-plane smoke on R149 and R7
        shell: bash
        run: |
          set -u
          mkdir -p "$WORK/dynamic"

          run_one() {
            local key="$1" board="$2" model="$3" port="$4"
            local root="$WORK/$key/rootfs"
            local lab="$WORK/dynamic/$key-lab"
            local out="$WORK/dynamic/$key"
            mkdir -p "$out"

            set +e
            ROUTERLAB_CUDY_ROOTFS="$root" \
            ROUTERLAB_CUDY_WEB_WORK="$lab" \
            ROUTERLAB_CUDY_PORT="$port" \
            ROUTERLAB_CUDY_BOARD_NAME="$board" \
            ROUTERLAB_CUDY_MODEL_NAME="$model" \
            QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
              timeout --signal=TERM --kill-after=10s 150s \
              bash tools/routerlab/web-demo/cudy-factory-runtime.sh reset \
              >"$out/reset.log" 2>&1
            reset_rc=$?
            echo "$reset_rc" > "$out/reset.rc"

            quick_rc=99
            if [[ "$reset_rc" -eq 0 ]]; then
              ROUTERLAB_CUDY_RUNTIME="$lab/runtime" \
              ROUTERLAB_CUDY_PORT="$port" \
              QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
                timeout --signal=TERM --kill-after=10s 150s \
                bash tools/routerlab/web-demo/cudy-quick-setup.sh \
                >"$out/quick.log" 2>&1
              quick_rc=$?
            else
              echo "quick setup skipped: runtime reset failed" >"$out/quick.log"
            fi
            echo "$quick_rc" > "$out/quick.rc"

            ROUTERLAB_CUDY_ROOTFS="$root" \
            ROUTERLAB_CUDY_WEB_WORK="$lab" \
            ROUTERLAB_CUDY_PORT="$port" \
            ROUTERLAB_CUDY_BOARD_NAME="$board" \
            ROUTERLAB_CUDY_MODEL_NAME="$model" \
            QEMU_MIPSEL=/usr/bin/qemu-mipsel-static \
              bash tools/routerlab/web-demo/cudy-factory-runtime.sh stop \
              >>"$out/reset.log" 2>&1 || true
            set -e

            echo "===== $key dynamic ====="
            echo "reset_rc=$reset_rc quick_rc=$quick_rc"
            if [[ -f "$lab/logs/uci-defaults.log" ]]; then
              echo "--- uci-defaults user/account tail ---"
              grep -n -A30 -B10 '10_user\|passwd\|user_add' "$lab/logs/uci-defaults.log" 2>/dev/null | tail -n 120 || true
            fi
            if [[ -f "$lab/runtime/etc/shadow" ]]; then
              echo "--- runtime shadow scheme only ---"
              awk -F: '{h=$2; if (h=="") s="empty"; else if (h=="!") s="locked"; else if (h=="*") s="star"; else if (h ~ /^\$/) {split(h,a,"$"); s="$" a[2] "$"} else s="other"; print $1 ":" s}' "$lab/runtime/etc/shadow" 2>/dev/null || true
            fi
            echo "--- reset tail ---"
            tail -n 80 "$out/reset.log" || true
            echo "--- quick tail ---"
            tail -n 120 "$out/quick.log" || true
          }

          run_one r26 R26 'Cudy WR1200 2.x RouterLab R26' 18026
          run_one r149 R149 'Cudy WR1200 3.0 RouterLab R149' 18149
          run_one r7 R7 'Cudy WR1200 1.0 RouterLab R7' 18007

          {
            echo '# Dynamic cross-hardware smoke'
            echo
            echo '| Board | reset rc | quick rc |'
            echo '|---|---:|---:|'
            for key in r26 r149 r7; do
              echo "| $key | $(cat "$WORK/dynamic/$key/reset.rc") | $(cat "$WORK/dynamic/$key/quick.rc") |"
            done
          } > "$WORK/dynamic/INDEX.md"

          cat "$WORK/dynamic/INDEX.md"

      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-wr1200-hardware-intake
          path: |
            /home/runner/cudy-wr1200-hardware-intake/HARDWARE-INTAKE.md
            /home/runner/cudy-wr1200-hardware-intake/*/report/
            /home/runner/cudy-wr1200-hardware-intake/dynamic/INDEX.md
            /home/runner/cudy-wr1200-hardware-intake/dynamic/*/*.log
            /home/runner/cudy-wr1200-hardware-intake/dynamic/*/*.rc
          retention-days: 14
